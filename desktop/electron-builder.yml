# Packaging for Builda's desktop shell. `npm run web` first (the bundle goes in web/), then:
#   npx electron-builder --mac --dir      an unpacked Builda.app, what the local checks launch
#   npx electron-builder --mac            a DMG for Apple silicon and Intel
#   npx electron-builder --win            an NSIS installer, x64
#   npx electron-builder --linux          an AppImage
# Signing and notarization need the Developer ID certificate and an App Store Connect key, which
# live in a password manager and never in this repository (see docs/desktop.md); without them the
# Mac build is ad hoc signed and Gatekeeper asks once.
appId: com.vedantlbhatt.Builda.desktop
productName: Builda
copyright: Builda
directories:
  output: dist
  buildResources: assets
files:
  - src/**/*
  - web/**/*
  - assets/icon.png
  - package.json
  - "!**/*.map"
# FOUND IN REVIEW (2026-09-19): every fuse was at Electron's default, so the packaged app could be
# run as plain Node (ELECTRON_RUN_AS_NODE), take NODE_OPTIONS, or open an inspector, any of which lets
# a program running as the same user read the token store without a Keychain prompt.
electronFuses:
  runAsNode: false
  # OFF: encrypting the cookie store needs a Keychain key before the network stack can use it, so a
  # packaged app whose Keychain prompt nobody answered hung every request (FOUND ON THE PACKAGED APP,
  # 2026-09-19: "Builda took too long to answer", a SecurityAgent prompt open since the build). The
  # app keeps no cookies; its tokens are in safeStorage.
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
protocols:
  - name: Builda
    schemes:
      - builder
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSUserNotificationAlertStyle: alert
    LSUIElement: false
    # The same two the phone asks for, in the phone's words: the pairing screen can read a Mac
    # agent's code with the webcam, and a shared session can carry a voice note.
    NSCameraUsageDescription: Builda uses the camera only to scan the pairing code shown by the Mac agent.
    NSMicrophoneUsageDescription: Builda records the voice note you add to a shared session.
win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  icon: assets/icon.png
  category: Development
  target:
    - AppImage
